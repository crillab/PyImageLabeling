name: Tests

# Manual only: Actions tab > Tests > Run workflow. Nothing runs on push.
# Default: one Linux job. "full" adds Windows, macOS and Python 3.12.
# GPU tests (marked slow) stay local: pytest -m slow
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also Windows, macOS and Python 3.12 (slower)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check metadata and contents
        run: |
          python -m twine check --strict dist/*
          python .github/scripts/check_dist.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.full && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python: ${{ fromJSON(inputs.full && '["3.12", "3.13"]' || '["3.13"]') }}
    env:
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Qt and OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: CPU-only torch
        # the default Linux wheel pulls ~3 GB of CUDA libraries never used here
        if: runner.os == 'Linux'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install the built wheel
        run: python -m pip install dist/*.whl pytest
      - name: Smoke-test the installed wheel
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/.github/scripts/smoke_installed.py"
      # facebook/dinov2-small (85 MB), downloaded once by test_dinov2_probe
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-dinov2-small
      - name: Run the test suite (sources, CPU)
        run: python -m pytest tests -m "not slow" -q -p no:cacheprovider
