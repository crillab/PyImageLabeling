name: Set up Python for PyImageLabeling
description: >-
  Python with a pip cache; on Linux also the Qt/OpenCV system libraries and
  CPU-only torch. Shared by reusable-build.yml and reusable-tests.yml.

inputs:
  python-version:
    description: Python version
    default: "3.13"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Qt and OpenCV system libraries
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
    - name: CPU-only torch
      # the default Linux wheel pulls ~3 GB of CUDA libraries never used here
      if: runner.os == 'Linux'
      shell: bash
      run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
