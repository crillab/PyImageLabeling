[build-system]
# 77: SPDX `license = "MIT"` (PEP 639)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PyImageLabeling"
requires-python = ">= 3.12"
dynamic = ["version"]
authors = [
    { name = "Szczepanski Nicolas", email = "szczepanski@cril.fr" },
    { name = "Fayette Pierre-Marie", email = "pmarie.fayette@univ-artois.fr" }
]
maintainers = [
    { name = "Szczepanski Nicolas", email = "szczepanski@cril.fr" },
    { name = "Fayette Pierre-Marie", email = "pmarie.fayette@univ-artois.fr" }
]
keywords = [
    "image annotation", "image labeling", "labeling tool", "segmentation",
    "segmentation masks", "segment anything", "SAM", "MedSAM", "DINOv2",
    "text-to-mask", "active learning", "medical imaging", "digital pathology",
    "computer vision", "machine learning", "PyQt6",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Education",
]
dependencies = ["numpy", "pyqt6", "opencv-python", "pillow", "matplotlib", "torch", "torchvision", "transformers", "huggingface-hub"]
#optional-dependencies = { gui = ["pyqt6"] }
description = "Desktop image annotation tool for segmentation masks, with Segment Anything (SAM), text-to-mask, one-shot propagation and active learning. Runs offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]

[project.gui-scripts]
# `pyimagelabeling` command (no console window on Windows), e.g. after
# `uv tool install PyImageLabeling`; `python -m PyImageLabeling` still works
pyimagelabeling = "PyImageLabeling.__main__:__main__"

[project.urls]
Homepage = "https://www.cril.univ-artois.fr/pyimagelabeling/"
Documentation = "https://www.cril.univ-artois.fr/pyimagelabeling/"
Source = "https://github.com/crillab/PyImageLabeling"
Changelog = "https://github.com/crillab/PyImageLabeling/blob/master/CHANGELOG.md"
Issues = "https://github.com/crillab/PyImageLabeling/issues"
"Windows executable" = "https://github.com/crillab/PyImageLabeling/releases/latest"

[tool.setuptools]
package-dir = { PyImageLabeling = "PyImageLabeling" }
include-package-data = true

[tool.setuptools.exclude-package-data]
PyImageLabeling = ["parameters.json"]

[tool.setuptools.packages.find]
# without a filter, tests/ was installed as a top-level "tests" package
include = ["PyImageLabeling*"]

[tool.pytest.ini_options]
markers = [
    "slow: trains a real model end to end (needs a GPU, ~20s)",
] 

# Now, the version is in the setup.py file. 
